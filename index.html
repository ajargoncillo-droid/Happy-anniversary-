<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para sa Mahal Ko 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ece3fb;--bg2:#c9b3f2;--ink:#4b1d8f;--red:#7e4bd1;--card:#fff;--paper:#f3edfb;--shadow:rgba(75,29,143,.25);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1e1433;--bg2:#34205c;--ink:#d9c6ff;--red:#a678ff;--card:#1c1330;--paper:#2a1d47;--shadow:rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg1:#1e1433;--bg2:#34205c;--ink:#d9c6ff;--red:#a678ff;--card:#1c1330;--paper:#2a1d47;--shadow:rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);
background-image:repeating-linear-gradient(90deg,rgba(126,75,209,.2) 0 28px,transparent 28px 70px),repeating-linear-gradient(0deg,rgba(126,75,209,.2) 0 28px,transparent 28px 70px);background-attachment:fixed}
.screen{display:none;min-height:100vh;padding:28px 18px 60px;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fade .5s}
.screen.on{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h1,h2{margin:0 0 10px;font-weight:700;letter-spacing:1px;color:var(--ink);text-shadow:2px 2px 0 rgba(255,255,255,.5)}
h1{font-size:2.2rem}h2{font-size:1.9rem}
.script{font-family:'Dancing Script',cursive;font-weight:700}
.slots{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.slot{width:54px;height:62px;border:3px solid var(--ink);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700}
.hint{margin:8px 0 14px;font-size:.95rem}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;padding:16px;background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--shadow)}
.key{height:54px;border:0;border-radius:14px;background:var(--red);color:#fff;font:700 1.3rem 'Fredoka';cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.key:active{transform:translateY(3px);box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(40,15,80,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.box{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:22px 26px;max-width:300px;box-shadow:0 0 40px var(--red);animation:pop .35s}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.box .face{font-size:4.2rem;line-height:1.1}
.btn{margin-top:14px;padding:10px 26px;border:0;border-radius:999px;background:var(--red);color:#fff;font:600 1rem 'Fredoka';cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.gifts{display:grid;grid-template-columns:repeat(2,minmax(130px,170px));gap:16px;margin-top:18px}
.gift{border:0;background:none;padding:0;cursor:pointer;position:relative;aspect-ratio:1;filter:drop-shadow(0 5px 0 var(--shadow));transition:transform .2s}
.gift:hover,.gift:active{transform:scale(1.07) rotate(-3deg)}
.gift svg{width:100%;height:100%}
.gift span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:12%;font:700 .85rem 'Fredoka';color:#fff}
.gift span b{font-size:2.3rem;line-height:1}
.back{margin-top:26px;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:var(--card);color:var(--ink);font-size:1.4rem;cursor:pointer}
.wall{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;max-width:640px;width:100%;margin-top:14px}
.polaroid{background:var(--card);padding:10px 10px 14px;border-radius:6px;box-shadow:0 5px 14px var(--shadow);transform:rotate(var(--r,-2deg))}
.polaroid:nth-child(even){--r:2.5deg}
.ph{aspect-ratio:1;background:repeating-linear-gradient(45deg,#e3d4fb 0 10px,#efe6fd 10px 20px);display:flex;align-items:center;justify-content:center;font-size:2.4rem;border-radius:3px;border:3px dotted var(--red)}
.polaroid p{margin:10px 0 0;font:700 1.15rem 'Dancing Script',cursive;color:var(--ink)}
.kuro{position:absolute;left:50%;bottom:0;width:190px;transform:translateX(-50%);filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 6px var(--shadow));animation:float 3s ease-in-out infinite}
.kbub{position:absolute;left:50%;bottom:150px;transform:translateX(-170%);background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:6px 12px;font:700 1.1rem 'Dancing Script',cursive;box-shadow:3px 3px 0 var(--red)}
.polaroid img{width:100%;display:block;border-radius:3px}
.polaroid.wide{grid-column:1/-1;max-width:340px;margin:0 auto}
.collage{display:flex;flex-direction:column;gap:30px;max-width:680px;width:100%;margin-top:18px}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
.row:nth-child(even){flex-direction:row-reverse}
.pic{flex:0 0 52%;max-width:300px;transform:rotate(var(--r,-2deg));filter:drop-shadow(0 6px 10px var(--shadow))}
.row:nth-child(even) .pic{--r:2.5deg}
.pic img{width:100%;display:block}
.f0{background:var(--red);padding:10px;border-radius:6px}.f0 img{outline:3px dotted #fff;outline-offset:-3px}
.f1{background:var(--card);padding:7px;border-radius:4px}
.f2{background:#efe6fd;padding:10px;border-radius:6px;border:3px dotted var(--red)}
.row.tall .pic{flex-basis:46%;max-width:250px}
.cap{flex:1;font:700 clamp(1.2rem,4.8vw,1.75rem)/1.25 'Dancing Script',cursive;color:var(--ink);text-align:center;padding:0 4px}
.bq{position:relative;width:100%;max-width:560px;height:540px;margin-top:6px}
.rose{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:9rem;filter:drop-shadow(0 8px 6px var(--shadow))}
.bub{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-weight:700;font-size:.8rem;letter-spacing:1px;box-shadow:3px 3px 0 var(--red);animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.env{font-size:7rem;cursor:pointer;animation:float 2.5s ease-in-out infinite;background:none;border:0}
.seal{display:block;margin:0 auto;width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c4a2ff,#6a35c4);border:0;color:#fff;font-size:2.6rem;cursor:pointer;box-shadow:0 6px 14px var(--shadow);animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.1)}}
.letter{background:var(--paper);border:2px solid var(--ink);border-radius:10px;max-width:520px;padding:26px 22px;text-align:center;font:600 1.25rem/1.55 'Dancing Script',cursive;color:var(--ink);box-shadow:0 8px 20px var(--shadow);animation:fade .8s}
.letter p{margin:0 0 14px}
#cake{padding:0;position:relative;overflow:hidden;justify-content:flex-start}
.annbg{position:absolute;inset:0;background-size:cover;background-position:center 60%;animation:zoom 18s ease-in-out infinite alternate}
@keyframes zoom{to{transform:scale(1.08)}}
.annshade{position:absolute;inset:0;background:linear-gradient(rgba(35,10,70,.78),rgba(35,10,70,.25) 45%,rgba(35,10,70,.5))}
.anntxt{position:relative;z-index:2;padding:calc(10vh + env(safe-area-inset-top,0px)) 16px 0;animation:fade 2s}
.anntxt h1{font:500 clamp(1.9rem,8vw,4.2rem)/1.1 'Playfair Display',serif;color:#fff;letter-spacing:2px;text-shadow:0 2px 18px rgba(0,0,0,.5);margin:0}
.anntxt .lol{font:700 clamp(1.9rem,8vw,3.4rem) 'Dancing Script',cursive;color:#d4b8ff;margin-top:-.1em;text-shadow:0 2px 12px rgba(0,0,0,.5)}
#cake .back{position:absolute;z-index:3;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);margin:0;background:rgba(255,255,255,.9);color:#4b1d8f}
.heart{position:fixed;top:-30px;pointer-events:none;animation:fall linear forwards;z-index:30}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.big{font-size:2.4rem;margin:18px 0 4px}
small{opacity:.75}
body::before{content:"";position:fixed;inset:0;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><g fill='%23b794f6' fill-opacity='.35'><path transform='translate(40 50) scale(1.3)' d='M24 40C8 29 6 20 6 15c0-5 4-8 8-8 4 0 8 3 10 6 2-3 6-6 10-6 4 0 8 3 8 8 0 5-2 14-18 25z'/><path transform='translate(170 160) scale(1.7)' d='M24 40C8 29 6 20 6 15c0-5 4-8 8-8 4 0 8 3 10 6 2-3 6-6 10-6 4 0 8 3 8 8 0 5-2 14-18 25z'/><path transform='translate(190 45) scale(2)' d='M0-10L3-3 10 0 3 3 0 10-3 3-10 0-3-3z'/><path transform='translate(60 190) scale(1.6)' d='M0-10L3-3 10 0 3 3 0 10-3 3-10 0-3-3z'/><circle cx='120' cy='110' r='5'/><circle cx='230' cy='235' r='4'/><circle cx='20' cy='130' r='4'/></g></svg>");pointer-events:none;z-index:0}
.screen{position:relative;z-index:1}
.gift span b svg{width:40px;height:40px;display:block}
.env svg{width:190px;filter:drop-shadow(0 6px 6px var(--shadow))}
.bouq{position:absolute;left:50%;top:0;width:calc(100% - 190px);min-width:150px;max-width:270px;transform:translateX(-50%);filter:drop-shadow(0 8px 6px var(--shadow))}
.bq{height:560px}
.bub{font-size:clamp(.62rem,2.6vw,.8rem);padding:5px 9px}
.box .face svg{display:block;margin:0 auto}
</style>
</head>

  <div class="slots" id="slots"></div>

 const sad=m==='sad';
 const eyes=sad?`<ellipse cx="88" cy="104" rx="8" ry="10" fill="#2a1540"/><ellipse cx="132" cy="104" rx="8" ry="10" fill="#2a1540"/><circle cx="91" cy="100" r="3" fill="#fff"/><circle cx="135" cy="100" r="3" fill="#fff"/><path d="M84 118q-5 12-1 22M136 118q5 12 1 22" stroke="#6fc3ff" stroke-width="5" fill="none" stroke-linecap="round"/>`:`<path d="M76 106q12-16 24 0M120 106q12-16 24 0" fill="none" stroke="#2a1540" stroke-width="5" stroke-linecap="round"/>`;
 const mouth=sad?`<path d="M100 132q10-10 20 0" fill="none" stroke="#2a1540" stroke-width="3.5" stroke-linecap="round"/>`:`<path d="M98 120q12 18 24 0z" fill="#ff7fa8" stroke="#2a1540" stroke-width="3" stroke-linejoin="round"/>`;
 return `<svg viewBox="30 8 160 150" width="130"><path d="M52 62L60 14 98 46Z" fill="#7c4dbd" stroke="#2a1540" stroke-width="4" stroke-linejoin="round"/><path d="M168 62L160 14 122 46Z" fill="#7c4dbd" stroke="#2a1540" stroke-width="4" stroke-linejoin="round"/><ellipse cx="110" cy="98" rx="66" ry="56" fill="#8e5ccf" stroke="#2a1540" stroke-width="4"/><ellipse cx="110" cy="108" rx="50" ry="38" fill="#f7ecff"/>${eyes}<circle cx="72" cy="124" r="8" fill="#ff9fc0" opacity=".85"/><circle cx="148" cy="124" r="8" fill="#ff9fc0" opacity=".85"/>${mouth}</svg>`}
function drawBouquet(){
 const P=[['#e3c8ff','#cfa6ff','#b684f2','#9a63e0'],['#f3c6ea','#e6a3d9','#d27fc7','#b85fb0'],['#cdb4ff','#b595f7','#9a77ea','#7f58d6'],['#f0dcff','#dfbfff','#c79cf5','#ab7be6']];
 let s='';
 for(let a=0;a<14;a++){const t=a/14*6.283,x=150+Math.cos(t)*118,y=130+Math.sin(t)*92;s+=`<ellipse cx="${x}" cy="${y}" rx="30" ry="13" fill="#3f9b4a" stroke="#256b30" stroke-width="2" transform="rotate(${t*57.3} ${x} ${y})"/>`}
 for(let k=-4;k<=4;k++)s+=`<path d="M${150+k*5} 235Q${150+k*8} 300 ${150+k*9} 372" stroke="#3f9b4a" stroke-width="7" fill="none" stroke-linecap="round"/>`;
 s+='<rect x="128" y="300" width="44" height="12" rx="5" fill="#d9b25a"/><path d="M150 322C120 295 100 318 112 336 124 346 146 332 150 322ZM150 322C180 295 200 318 188 336 176 346 154 332 150 322Z" fill="#8f5de0" stroke="#4b1d8f" stroke-width="3"/><circle cx="150" cy="322" r="8" fill="#a678ff" stroke="#4b1d8f" stroke-width="3"/>';
 let n=0;
 for(let y=0;y<6;y++)for(let x=0;x<6;x++){const px=60+x*36+(y%2)*18,py=40+y*34,dx=(px-150)/105,dy=(py-125)/95;if(dx*dx+dy*dy>1)continue;const c=P[n++%4];
  s+=`<g><circle cx="${px}" cy="${py}" r="27" fill="${c[0]}" stroke="#4b1d8f" stroke-width="1.4"/><circle cx="${px}" cy="${py}" r="20" fill="${c[1]}"/><circle cx="${px}" cy="${py}" r="13" fill="${c[2]}"/><circle cx="${px}" cy="${py}" r="6" fill="${c[3]}"/><path d="M${px-12} ${py-5}Q${px} ${py-17} ${px+12} ${py-5}" stroke="#fff" stroke-opacity=".6" fill="none" stroke-width="2"/><path d="M${px-9} ${py+7}Q${px} ${py+15} ${px+9} ${py+7}" stroke="#fff" stroke-opacity=".45" fill="none" stroke-width="2"/></g>`}
 $('bouq').innerHTML=s}
drawBouquet();

let buf="";
$('hint').textContent="Hint: "+C.hint;
function draw(){$('slots').innerHTML=Array.from({length:C.code.length},(_,i)=>`<div class="slot">${buf[i]??'<span style="opacity:.3;color:var(--red)">♥</span>'}</div>`).join('')}
draw();
const keys=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
$('pad').innerHTML=keys.map(k=>`<button class="key" data-k="${k}">${k}</button>`).join('');
$('pad').onclick=e=>{const k=e.target.dataset.k;if(!k)return;
  if(k==='⌫')buf=buf.slice(0,-1);else if(k==='C')buf="";else if(buf.length<C.code.length)buf+=k;
  draw();
  if(buf.length===C.code.length)setTimeout(check,250)};
function check(){
  if(buf===C.code){
    modal(`<h2 style="font-size:1.5rem">Tama! Welcome, ${C.name}!</h2><div class="face">${kitty('happy')}</div><button class="btn" id="ok">Open my surprise</button>`);
    $('ok').onclick=()=>{closeModal();go('menu');rain()};
  }else{
    modal(`<h2 style="font-size:1.5rem">Wrong Passcode!</h2><div class="face">${kitty('sad')}</div><p>Try again?</p><button class="btn" id="retry">Retry</button>`);
    $('retry').onclick=()=>{closeModal();buf="";draw()};
  }
}

const G=[['pics',ICON.pics,'Pictures','#a97bf0'],['flowers',ICON.flowers,'Flowers','#8f5de0'],['mail',ICON.mail,'Letter','#b794f6'],['cake',ICON.cake,'Anniversary','#7a49d6']];
$('gifts').innerHTML=G.map(g=>`<button class="gift" data-go="${g[0]}">${heart(g[3])}<span><b>${g[1]}</b>${g[2]}</span></button>`).join('');
$('gifts').onclick=e=>{const b=e.target.closest('[data-go]');if(b){go(b.dataset.go);if(b.dataset.go==='cake')rain()}};

// Pictures (placeholders - papalitan ng actual photos)
$('wall').className='collage';
$('wall').innerHTML=C.photos.map((p,i)=>`<div class="row${p.wide?' tall':''}"><div class="pic f${i%3}"><img src="${p.src}" alt=""></div><div class="cap">${p.cap}</div></div>`).join('');

// Flowers
const L=[[0,4],[2,18],[0,32],[3,46]],R=[[0,8],[3,22],[0,36],[2,50]];
$('bq').insertAdjacentHTML('beforeend',L.map(([x,y],i)=>`<div class="bub" style="left:${x}%;top:${y}%;animation-delay:${i*.4}s">I MISS YOU</div>`).join('')+R.map(([x,y],i)=>`<div class="bub" style="right:${x}%;top:${y}%;animation-delay:${i*.5}s">I LOVE YOU</div>`).join(''));

// Mail
$('letter').innerHTML=C.letter.map(p=>`<p>${p.replace('💗',heartSvg(0)).replace(/\n/g,'<br>')}</p>`).join('');
$('seal').onclick=()=>{$('mailClosed').style.display='none';$('mailOpen').style.display='block';rain()};

// Falling hearts
function rain(){for(let i=0;i<26;i++){const h=document.createElement('div');h.className='heart';h.innerHTML=heartSvg(i);
  h.style.left=Math.random()*100+'vw';h.style.fontSize=14+Math.random()*20+'px';h.style.animationDuration=2.5+Math.random()*2.5+'s';h.style.animationDelay=Math.random()*1.2+'s';
  document.body.appendChild(h);setTimeout(()=>h.remove(),6500)}}
</script>
</body>
</html>
